# Netlify Configuration within apps/web
# Monorepo setup targeting apps/web for static SPA deployment

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"
  VITE_API_URL = "/api"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,NODE_OPTIONS,VITE_API_URL,CORS_ORIGIN,REVIEW_ID"

[context.production]
  publish = "dist"
  command = "npm run build"
  [context.production.environment]
    NODE_OPTIONS = "--max-old-space-size=4096"
    VITE_API_URL = "/api"

# Netlify Deploy Previews for Pull Requests
[context.deploy-preview]
  publish = "dist"
  command = "npm run build"
  [context.deploy-preview.environment]
    NODE_OPTIONS = "--max-old-space-size=4096"
    VITE_DEPLOY_ENV = "preview"
    SECRETS_SCAN_ENABLED = "false"
    SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,NODE_OPTIONS,VITE_API_URL,CORS_ORIGIN,REVIEW_ID"

# Branch Deployments for testing feature branches
[context.branch-deploy]
  publish = "dist"
  command = "npm run build"
  [context.branch-deploy.environment]
    NODE_OPTIONS = "--max-old-space-size=4096"
    VITE_DEPLOY_ENV = "branch"
    SECRETS_SCAN_ENABLED = "false"
    SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,NODE_OPTIONS,VITE_API_URL,CORS_ORIGIN,REVIEW_ID"

# API Proxy: Route /api requests to hosted NestJS backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://solar-crm-06uk.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
