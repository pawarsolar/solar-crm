version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: solar_crm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: solar_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          memory: 1024M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: solar_crm_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/solar_crm
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-service-key}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: solar_crm_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
