# Netlify Configuration for Solar EPC CRM
# Monorepo setup targeting apps/web for static SPA deployment

[build]
  base = "apps/web"
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,NODE_OPTIONS,VITE_API_URL,CORS_ORIGIN,REVIEW_ID"

# Production environment configuration
[context.production]
  publish = "apps/web/dist"
  command = "npm run build"
  [context.production.environment]
    NODE_ENV = "production"
    NODE_OPTIONS = "--max-old-space-size=4096"

# Netlify Deploy Previews for Pull Requests
# Every Pull Request automatically generates a unique isolated preview URL
[context.deploy-preview]
  publish = "apps/web/dist"
  command = "npm run build"
  [context.deploy-preview.environment]
    NODE_ENV = "production"
    NODE_OPTIONS = "--max-old-space-size=4096"
    VITE_DEPLOY_ENV = "preview"
    SECRETS_SCAN_ENABLED = "false"
    SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,NODE_OPTIONS,VITE_API_URL,CORS_ORIGIN,REVIEW_ID"

# Branch Deployments for testing feature branches prior to PR merge
[context.branch-deploy]
  publish = "apps/web/dist"
  command = "npm run build"
  [context.branch-deploy.environment]
    NODE_ENV = "production"
    NODE_OPTIONS = "--max-old-space-size=4096"
    VITE_DEPLOY_ENV = "branch"
    SECRETS_SCAN_ENABLED = "false"
    SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,NODE_OPTIONS,VITE_API_URL,CORS_ORIGIN,REVIEW_ID"

# Optional API Proxy: Route /api requests to external hosted NestJS backend
# If VITE_API_URL is omitted or set to '/api', configure this proxy to prevent HTML responses on API routes:
# [[redirects]]
#   from = "/api/*"
#   to = "https://api.yourdomain.com/api/:splat"
#   status = 200
#   force = true

# SPA Fallback routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
